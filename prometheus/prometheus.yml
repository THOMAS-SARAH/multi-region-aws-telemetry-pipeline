global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "mumbai_worker"
    static_configs:
      - targets: ["<MUMBAI_WORKER_IP>:9100"]

  - job_name: "virginia_worker"
    static_configs:
      - targets: ["<VIRGINIA_WORKER_IP>:9100"]
